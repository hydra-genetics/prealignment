resources: "resources.tsv"
samples: "samples.tsv"
units: "units.tsv"

default_container: "docker://hydragenetics/common:3.0.0"

fastp_pe:
  container: "docker://hydragenetics/fastp:0.20.1"

chopper:
  container: "docker://hydragenetics/chopper:0.15.0"
  extra: "--quality 10 --minlength 50 --maxlength 30000"

dorado_trim:
  container: "docker://hydragenetics/dorado:2.0.0"
  sequencing_kit: "SQK-NBD114-24"

filtlong:
  container: "docker://hydragenetics/filtlong:0.2.1"
  extra: "--min_mean_q 30 --keep_percent 75"

samtools_compress_fastq:
  container: "docker://hydragenetics/samtools:1.21"

samtools_fastq:
  container: "docker://hydragenetics/samtools:1.21"

seqtk_subsample:
  container: "docker://hydragenetics/seqtk:1.4"
  nr_reads: 100000

subsample: "seqtk"

sortmerna:
  container: "docker://hydragenetics/sortmerna:4.3.4"
  extra: "-e 0.000001"
  fasta:
    - "reference/genome.fasta"
  index: "reference/idx"

trimmer_software: "fastp_pe"
