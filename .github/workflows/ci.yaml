name: CI

on:
  push:
    branches:
      - develop
      - master
    paths:
      - "workflow/**"
      - ".tests/**"
      - "requirements*.txt"
  pull_request:
    branches:
      - develop
      - master
    paths:
      - "workflow/**"
      - ".tests/**"
      - "requirements*.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.test.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements.test.txt
      - name: Lint
        working-directory: .tests/integration
        run: snakemake --lint -n -s ../../workflow/Snakefile --configfile config.yaml

  snakefmt:
    name: Snakefmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint Code Base
        uses: github/super-linter@v4.9.0
        env:
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_SNAKEMAKE_SNAKEFMT: true
          OUTPUT_FOLDER: .github/linters/report

  dry-run:
    name: Snakemake dry run
    runs-on: ubuntu-latest
    needs: [lint, snakefmt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.test.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements.test.txt
      - name: Dry run — merge
        working-directory: .tests/integration
        run: snakemake --cores 2 -n -s ../../workflow/Snakefile --configfile config.yaml
      - name: Dry run — fastp + merge
        working-directory: .tests/integration
        run: snakemake --cores 2 -n -s ../../workflow/Snakefile --configfile config.yaml configs/fastp_merge_config.yaml

  integration:
    name: Integration test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [dry-run]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.test.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements.test.txt
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5
      - name: Cache container images
        id: cache-simg
        uses: actions/cache@v4
        with:
          path: ~/singularity_containers
          key: ${{ runner.os }}-simg-${{ hashFiles('config/**/*.yaml', '.tests/integration/*.yaml', 'workflow/Snakefile') }}
          restore-keys: |
            ${{ runner.os }}-simg
      - name: Create singularity containers dir
        run: mkdir -p ~/singularity_containers
      - name: Integration test — merge
        working-directory: .tests/integration
        run: |
          snakemake --cores 2 -s ../../workflow/Snakefile -j 2 --show-failed-logs \
            --configfiles config.yaml --use-singularity \
            --singularity-args " --cleanenv --bind /home/runner " \
            --singularity-prefix ~/singularity_containers/ && rm -r prealignment
      - name: Integration test — fastp + merge
        working-directory: .tests/integration
        run: |
          snakemake --cores 2 -s ../../workflow/Snakefile -j 2 --show-failed-logs \
            --configfiles config.yaml configs/fastp_merge_config.yaml --use-singularity \
            --singularity-args " --cleanenv --bind /home/runner " \
            --singularity-prefix ~/singularity_containers/
