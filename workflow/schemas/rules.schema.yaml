$schema: "https://json-schema.org/draft/2020-12/schema"
description: snakemake rule input and output files description file
type: object
properties:
  chopper:
    type: object
    description: input and output parameters for chopper
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bam:
            type: string
            description: adapter/primer trimmed unaligned ONT bam file from dorado_trim
      output:
        type: object
        description: list of outputs
        properties:
          bam:
            type: string
            description: unaligned bam file with reads that passed chopper filtering

  dorado_trim:
    type: object
    description: input and output parameters for dorado_trim
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bam:
            type: string
            description: unaligned ONT bam file, taken from the bam column of units.tsv
      output:
        type: object
        description: list of outputs
        properties:
          bam:
            type: string
            description: unaligned bam file with adapters and primers trimmed

  fastp_pe:
    type: object
    description: input and output parameters for fastp_pe
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          sample:
            type: string
            value: Fastq files specified in `units.tsv` obtained by get_fastq_file defined in the [hydra-genetics](https://github.com/hydra-genetics/hydra-genetics/blob/develop/hydra_genetics/utils/units.py) module
            description: Untrimmed `.fastq files` from the same sample
      output:
        type: object
        description: list of outputs
        properties:
          trimmed:
            type: string
            description: Trimmed `.fastq files` (read1 and read2) from the same sample
          html:
            type: string
            description: html QC report
          json:
            type: string
            description: json QC report

  filtlong:
    type: object
    description: input and output parameters for filtlong
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          fastq:
            type: string
            description: gzipped ONT fastq file from samtools_compress_fastq
      output:
        type: object
        description: list of outputs
        properties:
          fastq:
            type: string
            description: gzipped fastq file with reads that passed quality and length filtering

  merged:
    type: object
    description: input and output parameters for merged
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          fastq:
            type: string
            description: |
              Trimmed `.fastq files` (read1 or read2) from the same sample
              Files obtained by merged_input in defined in [`common.smk`](https://github.com/hydra-genetics/prealignment/blob/develop/workflow/rules/common.smk)
      output:
        type: object
        description: list of outputs
        properties:
          fastq:
            type: string
            description: Merged `.fastq files` (read1 or read2) from the same sample
  
  pbmarkdup:
    type: object
    description: input and output parameters for pbmarkdup
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bam:
            type: string
            description: bam file of unaligned pacbio reads
          
      output:
        type: string
        description: list of outputs
        properties:
          bam:
            type: string
            description: duplicate marked bam file

  samtools_compress_fastq:
    type: object
    description: input and output parameters for samtools_compress_fastq
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          fastq:
            type: string
            description: uncompressed fastq file from samtools_fastq
      output:
        type: object
        description: list of outputs
        properties:
          fastq:
            type: string
            description: gzipped fastq file

  samtools_fastq:
    type: object
    description: input and output parameters for samtools_fastq
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bam:
            type: string
            description: adapter/primer trimmed ONT bam file from dorado_trim
      output:
        type: object
        description: list of outputs
        properties:
          fastq:
            type: string
            description: uncompressed fastq file, with all bam tags as tab-separated fields after the read name

  seqtk_subsample:
    type: object
    description: input and output parameters for seqtk_subsample
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          fastq:
            type: string
            description: fastq file to be downsampled
      output:
        type: object
        description: list of outputs
        properties:
          fastq:
            type: string
            description: downsampled fastq file

  sortmerna:
    type: object
    description: input and output parameters for sortmerna
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          reads:
            type: array
            description: list of unfiltered merged .fastq files, containing either only merged read 1 files or both merged read 1 and merged read 2 files.
          ref:
            type: string
            description: Fasta reference genome
          idx_dir:
            type: string
            description: Sortmerna index directory
      output:
        type: object
        description: list of outputs
        properties:
          aligned:
            type: string
            description: Fastq with reads that align to ribosomal rna
          other:
            type: string
            description: rRNA filtered merged .fastq file
